name: Update Recycling Points Data

on:
  schedule:
    # Daily at 08:00 HKT (00:30 UTC) — data source updates infrequently but keeps fresh
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-recycling
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch latest recycling points data
        run: python fetch_recycling.py

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: daily update recycling points data'
          file_pattern: recycling_data.json
          skip_dirty: false