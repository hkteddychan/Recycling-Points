name: Check & Update Recycling Data
on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at 00:00 HKT
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check data freshness
        run: |
          echo "Last updated: $(git log -1 --format='%ai' -- recycling_data.json 2>/dev/null || echo 'unknown')"
          echo "Current file size: $(wc -c < recycling_data.json) bytes"
          echo "Feature count: $(python3 -c "import json; f=open('recycling_data.json'); d=json.load(f); print(len(d.get('features',[])))")"
      - name: Fetch latest data
        run: |
          # Try EPD recycling data API
          python3 -c "
import urllib.request, json, sys

# EPD API - try multiple endpoints
apis = [
    'https://www.wastereduction.gov.hk/api/recycling_points.json',
    'https://data.gov.hk/data/api/4/action/package_show?id=recycling',
]

for api in apis:
    try:
        req = urllib.request.Request(api, headers={'User-Agent': 'Mozilla/5.0'})
        with urllib.request.urlopen(req, timeout=15) as r:
            data = json.loads(r.read())
            print(f'SUCCESS: {api}')
            print(json.dumps(data, ensure_ascii=False)[:200])
            sys.exit(0)
    except Exception as e:
        print(f'FAILED: {api} - {e}', file=sys.stderr)

print('All APIs failed - no update needed (static data)', file=sys.stderr)
" || echo "No live API found - static data unchanged"
      - name: Commit if changed
        run: |
          if git diff --quiet recycling_data.json 2>/dev/null; then
            echo "No changes - recycling_data.json unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add recycling_data.json
            git commit -m "Auto-update recycling_data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
